spring.application.name=order-service
server.port=8083
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pharma_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
medicine-service.url=${MEDICINE_SERVICE_URL:http://localhost:8082}
internal.service-token=${INTERNAL_SERVICE_TOKEN}
jwt.secret=${JWT_SECRET}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
spring.cloud.compatibility-verifier.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
